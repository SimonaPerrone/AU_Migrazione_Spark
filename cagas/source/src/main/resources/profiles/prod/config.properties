# - distributore: requires filterPdr.distributore.path to be set and present on HDFS
# - distr-udd: requires filterPdr.udd.path and filterPdr.distributore.path to be set and present on HDFS
# - distr-udd-udb: requires filterPdr.udb.path, filterPdr.udd.path and filterPdr.distributore.path to be set and present on HDFS
# - oggettoVariazione
# - caricamentoTDS: requires tds.read.receive.endDate (data ghigliottina)
# - noMisure
# - forzatura
# - perimetroAggRic
