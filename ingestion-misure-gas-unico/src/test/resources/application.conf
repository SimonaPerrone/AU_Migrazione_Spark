include "ammissibilita.conf"

rootPath="src/test/resources"
tempRootPath=${rootPath}"/tempRootPath"
tempRootPathOld=${rootPath}"/tempRootPath"
timeZone="Europe/Rome"
hive {
  db {
    cmg_gas="cmg_gas"
    name="cmg_gas"
    rcu="rcu"
    rcugas="rcugas_test"
    path="/user/hive/warehouse/au.db/misure_gas_au/cmg_gas"
  }
   table {
      rcuAziendaP=${hive.db.rcu}".rcu_azienda_p"
      rcugasUDDP=${hive.db.rcugas}".rcugas_udd_p"
      ammissibilitaFile=${hive.db.cmg_gas}".report_ammissibilita_file"
      unzipLog=${hive.db.cmg_gas}".report_decompressione"
      flowLog = ${hive.db.cmg_gas}".report_ingestion"
      ammissibilitaPdr=${hive.db.cmg_gas}".report_ammissibilita_pdr"
      rcuGasPdr=${hive.db.rcugas}".rcugas_pdr_p"
      rcuGasPdrStato=${hive.db.rcugas}".rcugas_stato_pdr_p"
    }
}

ammissibilita {
  fileMaxLength=1000

  standard {
    path=${rootPath}"/ammiss"
  }

  igmg {
    path=${rootPath}"/ammiss"
  }

  igmr {
    path="${ammissibilita.igmr.path}"
  }

  xsd {
    path=${rootPath}"/test/xsd"
    periodico=${ammissibilita.xsd.path}"/FlussiDatiMisuraPrelievoGAS-Flusso1-Periodici.xsd"
    rettifica=${ammissibilita.xsd.path}"/FlussiDatiMisuraPrelievoGAS-Flusso2-Rettifica.xsd"
    igmg=${ammissibilita.xsd.path}"/igmg/FlussiDatiInterventoGruppoMisGAS-IGMG.xsd"
    igmr=${ammissibilita.xsd.path}"/igmr/FlussiDatiInterventoGruppoMisGAS-IGMR.xsd"
  }
}

unzip {
  inputPath=${rootPath}"/isilonshare_gas"
}