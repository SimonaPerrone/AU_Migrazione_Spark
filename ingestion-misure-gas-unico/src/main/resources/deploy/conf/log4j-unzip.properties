# Root logger option
log4j.rootLogger=WARN, file, stdout, tmp

# Direct log messages to a log file
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=${logs.root.path}/log-unzip-${currentDate}.log
log4j.appender.file.MaxFileSize=250MB
log4j.appender.file.MaxBackupIndex=5
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Direct log messages to a log file
log4j.appender.tmp=org.apache.log4j.RollingFileAppender
log4j.appender.tmp.File=/tmp/${decompressione.log.name}
log4j.appender.tmp.MaxFileSize=250MB
log4j.appender.tmp.Append=false
log4j.appender.tmp.layout=org.apache.log4j.PatternLayout
log4j.appender.tmp.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Direct log messages to stdout
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n